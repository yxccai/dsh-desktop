name: Build macOS prerelease

on:
  push:
    tags: ['v*-mac.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Build ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x64
            command: npm run build:mac:x64
          - os: macos-14
            arch: arm64
            command: npm run build:mac:arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build unsigned macOS packages
        run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify architecture and create checksums
        shell: bash
        run: |
          find dist -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -print
          cd dist
          shasum -a 256 *.dmg *.zip > SHA256SUMS-macos-${{ matrix.arch }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/SHA256SUMS-macos-${{ matrix.arch }}.txt
          if-no-files-found: error

  publish-prerelease:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Build combined checksum file
        shell: bash
        run: |
          cd release-assets
          sha256sum *.dmg *.zip > SHA256SUMS-${GITHUB_REF_NAME}.txt
      - name: Publish unsigned macOS prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: DSH Desktop ${{ github.ref_name }} (macOS test build)
          prerelease: true
          generate_release_notes: true
          body: |
            Unsigned macOS test build for Intel and Apple Silicon.

            These packages are not signed or notarized with an Apple Developer certificate. On first launch, Control-click DSH Desktop in Finder, choose Open, then confirm Open. If macOS still blocks it, open System Settings → Privacy & Security and choose Open Anyway.

            Please report the Mac model, macOS version, package architecture, and logs with any issue.
          files: release-assets/*
          fail_on_unmatched_files: true
